# Optional e2e: real rmfakecloud. Not used by `pnpm test`.
#   pnpm test:e2e
name: remarkable-mcp-e2e
services:
  rmfakecloud:
    image: ddvk/rmfakecloud:latest
    ports:
      - "13000:3000"
    environment:
      JWT_SECRET_KEY: e2e-secret-not-for-prod
      DATADIR: /data
      HASH_SCHEMA_VERSION: "3"
    tmpfs:
      - /data
