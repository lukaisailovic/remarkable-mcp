services:
  remarkable-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP: "1"
      MCP_HTTP_HOST: "0.0.0.0"
      PORT: "8080"
      REMARKABLE_HOST: ${REMARKABLE_HOST:-10.11.99.1}
      REMARKABLE_USER: ${REMARKABLE_USER:-root}
      REMARKABLE_PASSWORD: ${REMARKABLE_PASSWORD:-}
      REMARKABLE_KEY: ${REMARKABLE_KEY:-}
      REMARKABLE_FAKE: ${REMARKABLE_FAKE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
