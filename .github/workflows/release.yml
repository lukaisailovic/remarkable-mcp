name: Release

# Single maintainer-gated entry point for cutting a release. It bumps the version,
# tags it, and publishes @lukaisailovic/remarkable-mcp to npm (OIDC trusted
# publishing — no tokens). Triggered manually only, so forks and pull requests
# can never run it.
#
# npm trusted publishing is configured against THIS filename (release.yml).
# Renaming the file breaks publishing until the trusted publisher on npmjs.com
# is updated.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Build and validate without publishing or pushing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, publish & tag
    runs-on: ubuntu-latest
    if: github.repository == 'lukaisailovic/remarkable-mcp'
    environment: release
    permissions:
      contents: write # bump commit, tag, push, GitHub release
      id-token: write # npm OIDC trusted publishing + provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format, test & build
        run: |
          pnpm fmt:check
          pnpm lint
          pnpm build
          pnpm test

      - name: Resolve next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version --no-commit-hooks >/dev/null
          pnpm fmt package.json
          version="$(node -p "require('./package.json').version")"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight — refuse to clobber an existing release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::git tag ${TAG} already exists"
            exit 1
          fi
          if npm view "@lukaisailovic/remarkable-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@lukaisailovic/remarkable-mcp@${VERSION} is already published to npm"
            exit 1
          fi

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): @lukaisailovic/remarkable-mcp ${TAG}"
          git tag -a "${TAG}" -m "@lukaisailovic/remarkable-mcp ${VERSION}"

      # Push commit + tag together (atomic) BEFORE publishing, so a blocked push
      # (e.g. branch protection) fails the run before anything is published.
      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: git push --atomic origin "HEAD:${BRANCH}" "refs/tags/${TAG}"

      # OIDC trusted publishing is an npm-CLI feature requiring npm >= 11.5.1; the
      # version bundled with Node 22 is older. Upgrade first.
      - name: Upgrade npm for OIDC trusted publishing
        if: ${{ !inputs.dry_run }}
        run: npm install --global npm@latest

      # No NPM_TOKEN: npm mints a short-lived token from id-token:write, then
      # publishes the bundled dist with provenance.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm publish --no-git-checks --provenance --access public

      - name: Validate npm package (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm publish --no-git-checks --dry-run

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag --title "${TAG}")
          if [ "${PRERELEASE}" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${TAG}" "${flags[@]}"
